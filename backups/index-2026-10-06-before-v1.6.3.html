          const legacyAccounts = localStorage.getItem("retireLab_accounts_v3");
          const legacyGlobal = localStorage.getItem("retireLab_global_v3");
          if (envelope || legacyAccounts || legacyGlobal) {
            if (!envelope && (!legacyAccounts || !legacyGlobal)) throw new Error("저장된 계좌 또는 설정이 누락됐습니다.");
            const raw = envelope ? JSON.parse(envelope) : { accounts: JSON.parse(legacyAccounts), global: JSON.parse(legacyGlobal) };
            const state = validateState(raw.accounts, raw.global);
            setAccounts(state.accounts); setGlobal(state.global);
          }
          setIsLoaded(true);
        } catch (error) {
          setLoadError(`저장 데이터를 읽지 못했습니다. 원본을 보존하고 자동 저장을 중단했습니다. ${error.message}`);
        }
      }, []);

      useEffect(() => {
        if (!isLoaded || loadError || isRestoring) return;
        try { saveState(accounts, global); setSaveError(""); }
        catch (error) { setSaveError("변경사항을 저장하지 못했습니다. 백업 파일을 내려받아 보관해주세요."); }
      }, [accounts, global, isLoaded, loadError, isRestoring]);

      useEffect(() => { return () => { if (msgTimerRef.current) clearTimeout(msgTimerRef.current); }; }, []);

      // ── 자산 이력 로딩 (그래프용) ──
      useEffect(() => {
        if (!isLoaded || isRestoring) return;
        let cancelled = false;
        getAllHistory().then(rows => {
          if (cancelled) return;
          setHistoryData((rows || []).slice().sort((a, b) => a.date.localeCompare(b.date)));
          setHistoryReadError("");
        }).catch(error => {
          if (!cancelled) setHistoryReadError("자산 이력을 읽지 못했습니다. 기존 계좌 데이터는 유지됩니다.");
        });
        return () => { cancelled = true; };
      }, [isLoaded, isRestoring, historyReloadTick]);
      const retryHistory = () => {
        if (!latestSnapshotRef.current) { setHistoryReloadTick(t => t + 1); return; }
        putHistory(latestSnapshotRef.current).then(() => {
          setHistoryWriteError(""); setHistoryReloadTick(t => t + 1);
        }).catch(() => setHistoryWriteError("오늘 자산 이력을 저장하지 못했습니다. 브라우저 저장 공간을 확인하고 다시 시도해주세요."));
      };

      const showMsg = (type, text) => {
        setMsg({ type, text });
        if (msgTimerRef.current) clearTimeout(msgTimerRef.current);
        msgTimerRef.current = setTimeout(() => setMsg({ type: "", text: "" }), 4000);
      };

      const updateAcc = (fields) => setAccounts(prev => ({ ...prev, [activeAccount]: { ...prev[activeAccount], ...fields } }));
      const curAcc = accounts[activeAccount] || accounts.pension1;
      useEffect(() => {
        if (activeAccount === "report") return;
        setRebalanceInfo(nextRebalance(curAcc.rebalanceMonth, curAcc.rebalanceDay));
      }, [activeAccount, curAcc.rebalanceMonth, curAcc.rebalanceDay, todayKey]);

      // @section account-stats | 계좌 평가액·납입원금·손익 계산
      const calcAccStats = useCallback((acc) => {
        const allocationBaseValue = getAllocationBaseValue(acc.assets);
        const parkingValue = getParkingAssetValue(acc.assets);
        const totalCurrentValue = acc.assets.reduce((s, a) => s + getAssetMarketValue(a), 0);
        const totalBookValue = acc.assets.reduce((s, a) => s + ((Number(a.quantity) || 0) * (Number(a.price) || 0)), 0);
        
        const prevPrincipal = acc.pastContributions.reduce((s, p) => s + (Number(p.amount) || 0), 0);
        const prevDividend = acc.pastContributions.reduce((s, p) => s + (Number(p.dividend) || 0), 0);
        const activeCash = acc.contributions.filter(c => c.type !== "배당").reduce((s, c) => s + (Number(c.amount) || 0), 0);
        const activeDividend = acc.contributions.filter(c => c.type === "배당").reduce((s, c) => s + (Number(c.amount) || 0), 0);
        const currentMonthStr = `${currentYear}-${String(new Date().getMonth() + 1).padStart(2, "0")}`;
        const thisMonthDividend = acc.contributions.filter(c => String(c.month || "").slice(0, 7) === currentMonthStr && c.type === "배당").reduce((s, c) => s + (Number(c.amount) || 0), 0);
        
        const employerCash = acc.contributions.filter(c => c.month.startsWith(String(currentYear)) && c.type === "회사부담금").reduce((s, c) => s + (Number(c.amount) || 0), 0);
        const personalCash = acc.contributions.filter(c => c.month.startsWith(String(currentYear)) && c.type === "개인추가납입").reduce((s, c) => s + (Number(c.amount) || 0), 0);

        const purePrincipal = prevPrincipal + activeCash;
        const totalDividend = prevDividend + activeDividend;
        const capitalGain = totalCurrentValue - (purePrincipal + totalDividend);
        
        const bookReturnAmt = totalCurrentValue - totalBookValue;
        const bookReturnRate = totalBookValue > 0 ? (bookReturnAmt / totalBookValue) * 100 : 0;
        const principalReturnAmt = totalCurrentValue - purePrincipal;
        const principalReturnRate = purePrincipal > 0 ? (principalReturnAmt / purePrincipal) * 100 : 0;
        
        const pctP = totalCurrentValue > 0 ? (purePrincipal / totalCurrentValue) * 100 : 0;
        const pctD = totalCurrentValue > 0 ? (totalDividend / totalCurrentValue) * 100 : 0;
        const pctG = (totalCurrentValue > 0 && capitalGain > 0) ? (capitalGain / totalCurrentValue) * 100 : 0;
        const yearCash = acc.contributions.filter(c => c.month.startsWith(String(currentYear)) && c.type !== "배당").reduce((s, c) => s + (Number(c.amount) || 0), 0);
        
        const riskAssetValue = acc.assets.reduce((s, a) => s + getAssetMarketValue(a) * getRiskWeight(a), 0);
        const riskRatio = totalCurrentValue > 0 ? (riskAssetValue / totalCurrentValue) * 100 : 0;

        const equityExposureValue = acc.assets.reduce((s, a) => s + getAssetMarketValue(a) * getEquityExposureWeight(a), 0);
        const equityExposureRatio = totalCurrentValue > 0 ? (equityExposureValue / totalCurrentValue) * 100 : 0;
        
        const accHasTarget = acc.targetPortfolio && acc.targetPortfolio.length > 0 && acc.targetPortfolio.some(t => t.value > 0);
        const currentHoldingsChartData = [];
        
        if (!accHasTarget && allocationBaseValue > 0) {
          const allocAssets = getAllocationAssets(acc.assets);
          const grouped = allocAssets.reduce((grp, a) => {
            const cat = a.category || a.name || '미분류';
            if (!grp[cat]) grp[cat] = { name: cat, totalValue: 0, color: '#94a3b8' };
            grp[cat].totalValue += getAssetMarketValue(a);
            const tColor = (acc.targetPortfolio.find(t => t.name === cat) || {}).color;
            if (tColor) grp[cat].color = tColor;
            return grp;
          }, {});
          Object.values(grouped).forEach((item, idx) => currentHoldingsChartData.push({ name: item.name, value: Number(((item.totalValue / allocationBaseValue) * 100).toFixed(1)), color: item.color !== '#94a3b8' ? item.color : DEFAULT_COLORS[idx % DEFAULT_COLORS.length] }));
        }
        
        return { 
          totalCurrentValue, allocationBaseValue, parkingValue, totalBookValue,
          unknownRiskCount: acc.assets.filter(a => a.quantity > 0 && !["위험자산", "안전자산"].includes(a.assetType)).length, 
          purePrincipal, totalDividend, capitalGain, bookReturnAmt, bookReturnRate, 
          principalReturnAmt, principalReturnRate, pctP, pctD, pctG, yearCash, 
          riskRatio, equityExposureRatio, thisMonthDividend, currentHoldingsChartData, 
          employerCash, personalCash 
        };
      }, [currentYear, todayKey]);

      const stats = activeAccount === "report" ? {} : calcAccStats(curAcc);
      const recordedCash = getCashValue(curAcc.assets);
      const totalInvestableCash = curAcc.availableCash == null ? recordedCash : Math.max(0, Number(curAcc.availableCash) || 0);
      const parkingSecuritiesValue = getParkingSecuritiesValue(curAcc.assets);
      const activeHasTarget = activeAccount !== "report" && curAcc.targetPortfolio && curAcc.targetPortfolio.length > 0 && curAcc.targetPortfolio.some(t => t.value > 0);

      // @section report-stats | 통합 평가액·수익률·세액공제 계산
      const reportStats = useMemo(() => {
        const allKeys = ["pension1", "pension2", "irp", "dcIrp", "isa"];
        const statsMap = {};
        
        allKeys.forEach(key => {
          statsMap[key] = calcAccStats(accounts[key]);
        });

        const summary = allKeys.reduce((acc, key) => {
          const s = statsMap[key];
          acc.totalValue += s.totalCurrentValue;
          acc.totalPrincipal += s.purePrincipal;
          acc.totalDividend += s.totalDividend;
          acc.totalBookValue += s.totalBookValue;
          acc.accountValues.push({ name: accounts[key].label.split(" ")[0], value: s.totalCurrentValue, color: accounts[key].color });
          acc.accountDetail[key] = {
            value: s.totalCurrentValue,
            principal: s.purePrincipal,
            dividend: s.totalDividend,
            bookValue: s.totalBookValue,
            bookReturnAmt: s.bookReturnAmt,
            bookReturnRate: Number(s.bookReturnRate.toFixed(2)),
            principalReturnAmt: s.principalReturnAmt,
            principalReturnRate: Number(s.principalReturnRate.toFixed(2)),
          };
          return acc;
        }, { totalValue: 0, totalPrincipal: 0, totalDividend: 0, totalBookValue: 0, accountValues: [], accountDetail: {} });
        
        summary.totalReturnRate = cumulativeReturnRate(summary.totalValue, summary.totalPrincipal);

        // 종목코드로 합산하고 코드가 없는 직접입력 자산은 별도로 유지합니다.
        summary.mergedAssets = mergeAccountAssets(accounts, allKeys);
        summary.totalMergedValue = summary.mergedAssets.reduce((n, a) => n + a.totalMarketValue, 0);

        const dcIrpTaxCreditCash = (accounts.dcIrp && accounts.dcIrp.taxCreditEligible) ? accounts.dcIrp.contributions
          .filter(c => c.month.startsWith(String(currentYear)) && c.type === "개인추가납입")
          .reduce((s, c) => s + (Number(c.amount) || 0), 0) : 0;

        const creditBase = (statsMap.pension1?.yearCash || 0) + (statsMap.irp?.yearCash || 0) + dcIrpTaxCreditCash;
        summary.estimatedTaxRefund = Math.min(creditBase, 9000000) * (global.incomeLevel === "5500이하" ? 0.165 : 0.132);
        return summary;
      }, [accounts, global, currentYear, calcAccStats]);

      // @section history-snapshot | 오늘 자산 이력 기록
      // ── 앱 열 때 오늘 자 자산 이력 기록 (오늘=덮어쓰기, 지난날=동결) ──
      useEffect(() => {
        if (!isLoaded || isRestoring || loadError) return;
        if (!reportStats || typeof reportStats.totalValue !== "number") return;
        if (reportStats.totalValue <= 0) return; // 데이터 로드 전 0값 방지

        const today = localDateKey();
        const rs = reportStats;
        const totalBookReturnAmt = Math.round(rs.totalValue - rs.totalBookValue);
        const totalPrincipalReturnAmt = Math.round(rs.totalValue - rs.totalPrincipal);
        const snapshot = {
          date: today,
          totalValue: Math.round(rs.totalValue),
          totalPrincipal: Math.round(rs.totalPrincipal),
          totalDividend: Math.round(rs.totalDividend),
          totalBookValue: Math.round(rs.totalBookValue),
          // 평가손익(매수원가 대비)
          bookReturnAmt: totalBookReturnAmt,
          bookReturnRate: rs.totalBookValue > 0 ? Number(((totalBookReturnAmt / rs.totalBookValue) * 100).toFixed(2)) : 0,
          // 누적손익(원금 대비)
          principalReturnAmt: totalPrincipalReturnAmt,
          principalReturnRate: rs.totalPrincipal > 0 ? Number(((totalPrincipalReturnAmt / rs.totalPrincipal) * 100).toFixed(2)) : 0,
          accounts: Object.fromEntries(
            Object.entries(rs.accountDetail || {}).map(([k, v]) => [
              k,
              {
                value: Math.round(v.value),
                principal: Math.round(v.principal),
                dividend: Math.round(v.dividend || 0),
                bookValue: Math.round(v.bookValue || 0),
                bookReturnAmt: Math.round(v.bookReturnAmt || 0),
                bookReturnRate: v.bookReturnRate || 0,
                principalReturnAmt: Math.round(v.principalReturnAmt || 0),
                principalReturnRate: v.principalReturnRate || 0,
              }
            ])
          ),
          updatedAt: Date.now(),
        };

        latestSnapshotRef.current = snapshot;
        // 오늘 날짜는 항상 덮어씀. (지난 날짜는 이 로직이 건드리지 않음 — 키가 today이므로)
        putHistory(snapshot)
          .then(() => { setHistoryWriteError(""); setHistoryReloadTick(t => t + 1); })
          .catch(() => setHistoryWriteError("오늘 자산 이력을 저장하지 못했습니다. 브라우저 저장 공간을 확인하고 다시 시도해주세요."));
      }, [isLoaded, isRestoring, loadError, todayKey, reportStats.totalValue, reportStats.totalPrincipal, reportStats.totalDividend, reportStats.accountDetail]);


      // @section sorting | 주문계획 연결·종목 정렬·드래그
      const buyLogic = useMemo(() => activeAccount === "report" ? {} : calculateBuyPlan(curAcc, totalInvestableCash, parkingDeployRatio), [curAcc, totalInvestableCash, activeAccount, parkingDeployRatio]);

      // 종목별 합산 현황 표시용 정렬 결과
      const sortedMergedAssets = useMemo(() => {
        const list = reportStats.mergedAssets || [];
        if (list.length === 0) return [];

        // 직접정렬 모드
        if (mergedSortKey === 'custom' && mergedCustomOrder.length > 0) {
          const orderMap = {};
          mergedCustomOrder.forEach((name, idx) => { orderMap[name] = idx; });
          // 커스텀 순서에 없는 새 항목은 맨 뒤로
          return [...list].sort((a, b) => {
            const ai = orderMap[a.mergeKey] ?? 9999;
            const bi = orderMap[b.mergeKey] ?? 9999;
            return ai - bi;
          });
        }

        // 기준 정렬
        return [...list].sort((a, b) => {
          let aVal, bVal;
          if (mergedSortKey === 'returnRate') {
            aVal = a.returnRate; bVal = b.returnRate;
          } else if (mergedSortKey === 'returnAmt') {
            aVal = a.returnAmt; bVal = b.returnAmt;
          } else {
            // 기본: value (평가금액)
            aVal = a.totalMarketValue; bVal = b.totalMarketValue;
          }
          return mergedSortDir === 'desc' ? bVal - aVal : aVal - bVal;
        });
      }, [reportStats.mergedAssets, mergedSortKey, mergedSortDir, mergedCustomOrder]);

      // 직접정렬 모드 진입 — 현재 표시 순서를 초기 커스텀 순서로 설정
      const handleEnterCustomSort = () => {
        setMergedCustomOrder(sortedMergedAssets.map(a => a.mergeKey));
        setMergedSortKey('custom');
      };

      // ── 드래그 앤 드롭 핸들러 ──
      const applyDrop = (fromIdx, toIdx) => {
        if (fromIdx === null || toIdx === null || fromIdx === toIdx) return;
        const order = [...mergedCustomOrder];
        const [removed] = order.splice(fromIdx, 1);
        order.splice(toIdx, 0, removed);
        setMergedCustomOrder(order);
      };

      // HTML5 DnD (데스크톱)
      const handleDragStart = (idx) => {
        setDraggedIdx(idx);
      };
      const handleDragOver = (e, idx) => {
        e.preventDefault();
        setDragOverIdx(idx);
      };
      const handleDrop = (idx) => {
        applyDrop(draggedIdx, idx);
        setDraggedIdx(null);
        setDragOverIdx(null);
      };
      const handleDragEnd = () => {
        setDraggedIdx(null);
        setDragOverIdx(null);
      };

      // Touch (모바일)
      const handleTouchStart = (idx) => {
        touchStartRef.current.idx = idx;
        setDraggedIdx(idx);
      };

      const handleTouchEnd = () => {
        applyDrop(touchStartRef.current.idx, dragOverIdxRef.current);
        touchStartRef.current.idx = null;
        dragOverIdxRef.current = null;
        setDraggedIdx(null);
        setDragOverIdx(null);
      };
      // ── DnD 끝 ──

      useEffect(() => {
        const el = mergedListRef.current;
        if (!el) return;

        const onTouchMove = (e) => {
          // 직접정렬 모드일 때만 스크롤 차단 후 드래그 처리
          if (touchStartRef.current.idx === null) return;
          e.preventDefault();

          const touch = e.touches[0];
          const elements = el.querySelectorAll('[data-merged-drag-idx]');
          let closestIdx = null;
          let closestDist = Infinity;
          elements.forEach(elItem => {
            const rect = elItem.getBoundingClientRect();
            const centerY = rect.top + rect.height / 2;
            const dist = Math.abs(touch.clientY - centerY);
            if (dist < closestDist) {
              closestDist = dist;
              closestIdx = parseInt(elItem.dataset.mergedDragIdx, 10);
            }
          });
          if (closestIdx !== null && closestIdx !== touchStartRef.current.idx) {
            dragOverIdxRef.current = closestIdx;
            setDragOverIdx(closestIdx);
          }
        };

        el.addEventListener('touchmove', onTouchMove, { passive: false });
        return () => el.removeEventListener('touchmove', onTouchMove);
      }, [mergedSortKey]);

      // @section asset-edit | 자산·납입내역 편집
      const chAsset = (id, f, v) => {
        const key = `${activeAccount}:${id}`;
        quoteVersions.current.set(key, (quoteVersions.current.get(key) || 0) + 1);
        if (["quantity", "price", "currentPrice"].includes(f)) v = Math.max(0, Number(v) || 0);
        if (f === "quantity") v = Math.floor(v);
        updateAcc({ assets: curAcc.assets.map(a => a.id === id ? { ...a, [f]: v, ...(f === "code" ? { priceUpdatedAt: null, priceSource: null, priceFetchFailedAt: null } : f === "currentPrice" ? { priceUpdatedAt: null, priceSource: "manual", priceFetchFailedAt: null } : {}) } : a) });
      };
      const chContrib = (id, f, v) => updateAcc({ contributions: curAcc.contributions.map(c => c.id === id ? { ...c, [f]: v } : c) });
      const chPast = (id, f, v) => updateAcc({ pastContributions: curAcc.pastContributions.map(c => c.id === id ? { ...c, [f]: v } : c) });

      const moveAsset = (index, direction) => {
        if ((direction === -1 && index === 0) || (direction === 1 && index === curAcc.assets.length - 1)) return;
        const newAssets = [...curAcc.assets];
        const temp = newAssets[index];
        newAssets[index] = newAssets[index + direction];
        newAssets[index + direction] = temp;
        updateAcc({ assets: newAssets });
      };

      // @section price-fetch | 가격 조회·동시성·갱신
      const GAS_PRICE_PROXY = "https://script.google.com/macros/s/AKfycbzijpg_P0TzHc418PyTwfyny64E5cerg510hn3_WraR6kJ3gnzgh7sd8zITnZ9brN_4Jg/exec";

      const fetchJsonWithTimeout = async url => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 10000);
        try { const res = await fetch(url, { signal: controller.signal }); if (!res.ok) throw new Error(`HTTP ${res.status}`); return await res.json(); }
        finally { clearTimeout(timer); }
      };
      const parseQuote = (price, name) => {
        const num = Number(String(price ?? "").replace(/,/g, ""));
        return Number.isFinite(num) && num > 0 ? { price: num, name: typeof name === "string" ? name : "" } : null;
      };
      const fetchStock = async code => {
        const cleaned = String(code).trim().toUpperCase();
        if (!/^[0-9A-Z]{6}$/.test(cleaned)) return null;
        try {
          const g = await fetchJsonWithTimeout(`${GAS_PRICE_PROXY}?code=${encodeURIComponent(cleaned)}`);
          const quote = g?.ok ? parseQuote(g.price, g.name) : null;
          if (quote) return quote;
        } catch (error) { /* 다음 조회 경로 사용 */ }
        const url = `https://m.stock.naver.com/api/stock/${cleaned}/basic`;
        for (const proxy of [`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`, `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`]) {
          try {
            const d = await fetchJsonWithTimeout(proxy);
            const actual = proxy.includes("allorigins") && d.contents ? JSON.parse(d.contents) : d;
            const quote = parseQuote(actual.closePrice || actual.result?.closePrice, actual.stockName || actual.result?.stockName);
            if (quote) return quote;
          } catch (error) { /* 이전 가격 보존 */ }
        }
        return null;
      };
      const quoteVersions = useRef(new Map());
      const priceBusy = useRef(false);
      const requestQuote = async (accKey, asset) => {
        const key = `${accKey}:${asset.id}`;
        const version = (quoteVersions.current.get(key) || 0) + 1;
        quoteVersions.current.set(key, version);
        const result = await fetchStock(asset.code);
        return { ...(result || {}), failed: !result, id: asset.id, code: asset.code, version, key, priceUpdatedAt: new Date().toISOString() };
      };
      const applyQuotes = (accKey, updates) => setAccounts(prev => {
        if (!prev[accKey]) return prev;
        return { ...prev, [accKey]: { ...prev[accKey], assets: prev[accKey].assets.map(a => {
          const quote = updates.find(u => u && u.id === a.id && String(u.code).trim().toUpperCase() === String(a.code).trim().toUpperCase() && quoteVersions.current.get(u.key) === u.version);
          if (!quote) return a;
          if (quote.failed) return { ...a, priceFetchFailedAt: quote.priceUpdatedAt };
          return { ...a, name: quote.name || a.name, currentPrice: quote.price, priceUpdatedAt: quote.priceUpdatedAt, priceSource: "quote", priceFetchFailedAt: null };
        }) } };
      });
      const onCodeBlur = async (id, code) => {
        if (!/^[0-9A-Za-z]{6}$/.test(String(code).trim())) return;
        const key = activeAccount;
        setFetchingId(id);
        try {
          const result = await requestQuote(key, { id, code });
          if (result && !result.failed) { applyQuotes(key, [result]); showMsg("success", "현재가 조회가 완료됐습니다."); }
          else { applyQuotes(key, [result]); showMsg("error", "현재가 조회에 실패했습니다. 이전 가격을 유지합니다."); }
        } finally { setFetchingId(null); }
      };
      const refreshPrices = async allAccounts => {
        if (priceBusy.current) return;
        priceBusy.current = true;
        const keys = allAccounts ? Object.keys(accounts) : [activeAccount];
        const capturedAccounts = accounts;
        const failed = [];
        allAccounts ? setIsFetchingAll(true) : setIsFetching(true);
        setFetchError("");
        try {
          for (const key of keys) {
            const assets = capturedAccounts[key]?.assets || [];
            const coded = assets.filter(a => a.code && String(a.code).trim().length > 0);
            const updates = await fetchWithConcurrency(coded, async a => {
              const result = await requestQuote(key, a);
              if (!result || result.failed) failed.push(a.name || a.code);
              return result;
            }, 6, 100);
            applyQuotes(key, updates);
          }
          if (failed.length) { setFetchError(`조회 실패: ${formatFailedNames(failed)}`); showMsg("error", `조회 실패: ${formatFailedNames(failed)}. 이전 가격을 유지합니다.`); }
          else showMsg("success", "현재가 조회가 완료됐습니다.");
        } catch (error) { showMsg("error", "현재가 갱신을 중단했습니다. 다시 시도해주세요."); }
        finally { priceBusy.current = false; setIsFetching(false); setIsFetchingAll(false); }
      };
      const fetchAllPrices = () => refreshPrices(false);
      const fetchAllAccountsPrices = () => refreshPrices(true);

      // @section backup-restore | JSON 백업·복원·연도마감
      const exportData = async () => {
        const history = await getAllHistory();
        downloadJson({ schemaVersion: "1.2", exportedAt: new Date().toISOString(), accounts, global, history }, `절세3총사_백업_${localDateKey()}.json`);
      };
      const onExport = async () => {
        try { await exportData(); showMsg("success", "백업 파일 다운로드를 요청했습니다."); }
        catch (error) { showMsg("error", "이력을 읽지 못해 전체 백업을 중단했습니다. 다시 시도해주세요."); }
      };
      const exportRawStorage = () => {
        try { downloadJson({ savedState: localStorage.getItem(STORAGE_KEY), accountsV3: localStorage.getItem("retireLab_accounts_v3"), globalV3: localStorage.getItem("retireLab_global_v3") }, `절세3총사_원본저장데이터_${localDateKey()}.json`); }
        catch (error) { setLoadError("저장소에 접근할 수 없습니다. 브라우저 저장소 설정을 확인해주세요."); }
      };
      const importData = async (e) => {
        const file = e.target.files[0]; e.target.value = "";
        if (!file || isRestoring) return;
        setIsRestoring(true);
        try {
          if (file.size > 20 * 1024 * 1024) throw new Error("백업 파일은 20MB 이하만 지원합니다.");
          const restored = validateBackup(JSON.parse(await file.text()));
          if (loadError) exportRawStorage(); else await exportData();
          // 기록 전 실패하면 기존 계좌 상태를 바꾸지 않습니다.
          saveState(restored.accounts, restored.global);
          quoteVersions.current.forEach((v, key) => quoteVersions.current.set(key, v + 1));
          setAccounts(restored.accounts); setGlobal(restored.global);
          setLoadError(""); setSaveError(""); setIsLoaded(true);
          try {
            await mergeHistory(restored.history);
            setHistoryReloadTick(t => t + 1);
            showMsg("success", `계좌 복구 완료! 이력 ${restored.history.length}일치 병합`);
          } catch (error) { showMsg("error", "계좌는 복구됐지만 이력 복구에 실패했습니다. 백업 파일을 보관하고 다시 시도해주세요."); }
        } catch (error) {
          const message = `복원을 중단했습니다. ${error.message}`;
          if (loadError) setLoadError(message); else showMsg("error", message);
        } finally { setIsRestoring(false); }
      };
      const doSettle = async () => {
        if (isSettling) return;
        setIsSettling(true);
        try {
          const key = activeAccount;
          const next = settleAccount(curAcc, currentYear);
          await exportData();
          if (stateRef.current.accounts !== accounts || stateRef.current.global !== global) throw new Error("백업 중 데이터가 변경됐습니다. 다시 시도해주세요.");
          const nextAccounts = { ...accounts, [key]: next };
          saveState(nextAccounts, global);
          setAccounts(nextAccounts);
          showMsg("success", "원금·배당 합계를 유지하며 과거 연도를 마감했습니다.");
        } catch (error) { showMsg("error", `마감을 중단했습니다. ${error.message}`); }
        finally { setIsSettling(false); }
      };

      // @section app-shell | 복구 화면·탭·공통 화면 구성
      if (loadError) return (
        <div className="min-h-screen bg-slate-50 flex items-center justify-center p-6">
          <div className="max-w-md bg-white p-6 rounded-2xl border border-rose-200 space-y-4">
            <h1 className="font-black text-rose-700">데이터 복구가 필요합니다</h1>
            <p className="text-sm text-slate-700">{loadError}</p>
            <button onClick={exportRawStorage} className="w-full py-3 bg-slate-900 text-white rounded-xl">원본 저장 데이터 내려받기</button>
            <label className="block text-center py-3 bg-indigo-50 rounded-xl text-indigo-700">{isRestoring ? "복원 중…" : "정상 백업 파일로 복원"}<input disabled={isRestoring} type="file" accept=".json" onChange={importData} className="hidden" /></label>
          </div>
        </div>
      );
      if (!isLoaded) return <div className="min-h-screen flex items-center justify-center bg-slate-900 text-white font-bold">로딩 중...</div>;

      const cardBase = "bg-white rounded-2xl border border-slate-200 shadow-sm";
      const inpBase = "w-full bg-white border border-slate-200 rounded-xl px-3 py-3 text-sm font-semibold text-slate-800 outline-none focus:border-slate-400 transition-all";

      const tabs = [
        { id: "dashboard", icon: LayoutDashboard, label: "대시보드" },
        { id: "assets", icon: List, label: "자산" },
        { id: "contributions", icon: Wallet, label: "납입" },
        { id: "settings", icon: Settings, label: "설정" },
      ];

      const topAccTabs = [
        { id: "pension1", label: "연금저축1" },
        { id: "pension2", label: "연금저축2" },
        { id: "irp", label: "개인IRP" },
        { id: "dcIrp", label: "퇴직IRP(DC)" },
        { id: "isa", label: "ISA" },
        { id: "report", label: "통합리포트", icon: BarChart3 }
      ];

      return (
        <div className="min-h-screen bg-slate-50 pb-[84px] text-slate-800 font-sans selection:bg-indigo-100">

          {/* 상단 계좌 탭 */}
          <div className="bg-slate-900 pt-4 pb-3 shadow-lg sticky top-0 z-40">
            <div className="flex items-center gap-2 px-4">
              <div className="flex gap-2 overflow-x-auto scrollbar-hide flex-1 min-w-0">
                {topAccTabs.map(t => (
                  <button key={t.id} onClick={() => { setActiveAccount(t.id); setActiveTab("dashboard"); }}
                    className={`flex-shrink-0 flex items-center gap-1.5 px-4 py-2 text-xs font-bold transition-all shadow-sm rounded-full ${activeAccount === t.id ? 'bg-white text-slate-900' : 'bg-slate-800 text-slate-400 hover:text-white'}`}>
                    {t.icon && <t.icon size={14} />}
                    {t.label}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* 헤더 */}
          {activeAccount !== "report" && (
            <header className="bg-slate-900 pt-6 pb-16 px-4 text-center border-t border-slate-800">
              <div className="flex items-center justify-center gap-2 mb-2">
                <span className="w-2.5 h-2.5 rounded-full animate-pulse" style={{ background: curAcc.color }} ></span>
                <span className="text-white font-black text-xl">{global.userName}님의 {curAcc.label.split(" ")[0]}</span>
              </div>
              <p className="text-slate-400 text-xs font-medium">{curAcc.label.split(" ")[1] || "관리 대시보드"}</p>
            </header>
          )}

          {historyWriteError && activeAccount !== "report" && <div className="mx-4 my-3 p-3 bg-amber-50 text-amber-800 rounded-xl text-xs">{historyWriteError}<button onClick={retryHistory} className="ml-2 underline font-bold">다시 시도</button></div>}
          {saveError && <div className="mx-4 my-3 p-4 bg-rose-50 text-rose-700 rounded-xl text-sm">{saveError}<button onClick={onExport} className="ml-2 underline font-bold">백업</button></div>}
          {(isRestoring || isSettling) && <div className="fixed inset-0 z-[100] bg-slate-900/40 flex items-center justify-center"><p className="bg-white p-6 rounded-2xl font-bold">{isRestoring ? "복원 중…" : "연도 마감 중…"}</p></div>}
          <main className="max-w-4xl mx-auto px-4 mt-4 space-y-6">

            {/* @section report-ui | 통합 리포트 화면 */}
            {/* 통합 리포트 */}
            {activeAccount === "report" && (
              <div className="space-y-4 pt-4">
                {msg.text && (
                  <div className={`p-4 rounded-2xl text-sm font-bold flex items-center gap-2.5 ${msg.type === "success" ? "bg-emerald-50 text-emerald-700 border border-emerald-200" : "bg-rose-50 text-rose-600 border border-rose-200"}`}>
                    {msg.type === "success" ? <CheckCircle2 size={18} /> : <AlertTriangle size={18} />}
                    {msg.text}
                  </div>
                )}
                <p className="text-[10px] text-slate-400 text-right px-1" aria-label={`앱 버전 ${APP_VERSION}`}>앱 v{APP_VERSION}</p>
                <div className={`${cardBase} p-6 relative overflow-hidden`}>
                  <div className="flex justify-between items-center mb-4 relative z-10">
                    <div className="flex items-center gap-2">
                      <BarChart3 className="text-slate-700" size={20} />
                      <h2 className="text-lg font-black text-slate-800">통합 자산 요약</h2>
                    </div>
                    <button onClick={fetchAllAccountsPrices} disabled={isFetchingAll}
                      className="flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs font-bold transition-all shadow-sm">
                      <RefreshCw size={12} className={isFetchingAll ? "animate-spin" : ""} /> 일괄 갱신
                    </button>
                  </div>
                  <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">총 합계 자산</p>
                  <p className="text-4xl font-black text-slate-900 mb-6 relative z-10">₩{fmt(reportStats.totalValue)}</p>
                  <div className="grid grid-cols-2 gap-4 border-t border-slate-100 pt-4 relative z-10">
                    <div><p className="text-[10px] font-bold text-slate-400">총 납입 원금</p><p className="text-sm font-bold text-slate-700">₩{fmt(reportStats.totalPrincipal)}</p></div>
                    <div>
                      <p className="text-[10px] font-bold text-slate-400">총 누적 손익</p>
                      <p className={`text-sm font-bold ${
                        (reportStats.totalValue - reportStats.totalPrincipal) >= 0
                          ? 'text-rose-500'
                          : 'text-blue-500'
                      }`}>
                        {(reportStats.totalValue - reportStats.totalPrincipal) >= 0 ? '+' : ''}
                        {fmt(reportStats.totalValue - reportStats.totalPrincipal)}원
                      </p>
                    </div>
                    <div className="col-span-2 flex items-center justify-between gap-3 border-t border-slate-100 pt-4">
                      <span className="flex items-center gap-1.5 text-xs font-bold text-slate-500">
                        총 누적 수익률
                      </span>
                      <span className={`text-xl font-black ${reportStats.totalReturnRate > 0 ? 'text-rose-500' : reportStats.totalReturnRate < 0 ? 'text-blue-500' : 'text-slate-700'}`}>
                        {formatReturnRate(reportStats.totalReturnRate)}
                      </span>
                    </div>
                    <details className="col-span-2 text-[11px] text-slate-500 leading-relaxed">
                      <summary className="cursor-pointer font-bold">수익률 계산 기준</summary>
                      <div className="mt-2 rounded-xl bg-slate-50 p-3 space-y-1">
                        <p>총 누적 손익 ÷ 총 납입 원금 × 100</p>
                        <p>납입 원금 대비 단순 누적 수익률이며, 연환산 수익률은 아닙니다.</p>
                        <p>자산에 반영된 배당은 중복으로 더하지 않습니다. 원금이 없으면 —로 표시합니다.</p>
                      </div>
                    </details>
                  </div>
                </div>
                <div className="bg-slate-900 rounded-3xl p-6 text-white shadow-xl relative overflow-hidden">
                  <div className="absolute top-4 right-4 opacity-10"><ShieldCheck size={80} /></div>
                  <p className="text-[10px] font-bold text-indigo-300 mb-1 uppercase tracking-widest">연말정산 예상 세액공제 환급금</p>
                  <p className="text-3xl font-black text-white mb-3">₩{fmt(reportStats.estimatedTaxRefund)}</p>
                  <p className="text-[10px] text-slate-400 leading-relaxed">
                    * 연금저축1 + 개인IRP + 퇴직IRP(개인추가분) 당해 납입액 기준 ({global.incomeLevel === "5500이하" ? "16.5%" : "13.2%"})<br />
                    * 실제 환급액은 개인의 결정세액에 따라 다를 수 있습니다.
                  </p>
                </div>

                {/* 자산 추이 그래프 */}
                <div className={`${cardBase} p-6`}>
                  <p className="text-sm font-bold text-slate-800 flex items-center gap-2 mb-4"><BarChart3 size={16} /> 자산 추이</p>
                  <div className="flex gap-1.5 mb-4 overflow-x-auto pb-1">
                    {[
                      { key: "total", label: "통합" },
                      { key: "pension1", label: "연금저축1" },
                      { key: "pension2", label: "연금저축2" },
                      { key: "irp", label: "개인IRP" },
                      { key: "dcIrp", label: "퇴직IRP" },
                      { key: "isa", label: "ISA" },
                    ].map(t => (
                      <button key={t.key} onClick={() => setHistoryAccount(t.key)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${historyAccount === t.key ? "bg-indigo-500 text-white shadow-sm" : "bg-slate-100 text-slate-500"}`}>
                        {t.label}
                      </button>
                    ))}
                  </div>
                  {(historyReadError || historyWriteError) && <div className="mb-3 p-3 rounded-xl bg-amber-50 text-amber-800 text-xs"><p>{historyReadError}</p><p>{historyWriteError}</p><button onClick={retryHistory} className="mt-2 underline font-bold">다시 시도</button></div>}
                  <HistoryChart history={historyData} accountKey={historyAccount} />
                </div>

                <DonutChart title="계좌별 자산 비중" subtitle="포트폴리오 내 자금 분산도" centerLabel="통합"
                  data={reportStats.accountValues.map(v => ({ ...v, value: reportStats.totalValue > 0 ? Number(((v.value / reportStats.totalValue) * 100).toFixed(1)) : 0 }))} />
                  
                {/* 개별 자산 합산 비중 섹션 */}
                {reportStats.mergedAssets && reportStats.mergedAssets.length > 0 && (
                  <div className="space-y-3">
                    <DonutChart
                      title="개별 자산 비중"
                      subtitle="전 계좌 동일 종목 합산 기준"
                      centerLabel="통합"
                      data={reportStats.mergedAssets.map(a => ({
                        name: a.name,
                        value: a.pct,
                        color: a.color,
                      }))}
                    />

                    <div className={`${cardBase} p-5`}>
                      {/* 헤더 + 정렬 버튼 */}
                      <div className="flex items-center justify-between mb-3 gap-2 flex-wrap">
                        <p className="text-sm font-bold text-slate-700 flex items-center gap-2 flex-shrink-0">
                          <List size={15} className="text-slate-400" /> 종목별 합산 현황
                        </p>
                        <div className="flex items-center gap-1 flex-wrap justify-end">
                          {[
                            { key: 'value',      label: '평가금액' },
                            { key: 'returnRate', label: '수익률'   },
                            { key: 'returnAmt',  label: '수익금액' },
                          ].map(opt => (
                            <button key={opt.key}
                              onClick={() => {
                                setDraggedIdx(null);
                                setDragOverIdx(null);
                                dragOverIdxRef.current = null;
                                if (mergedSortKey === opt.key) {
                                  setMergedSortDir(d => d === 'desc' ? 'asc' : 'desc');
                                } else {
                                  setMergedSortKey(opt.key);
                                  setMergedSortDir('desc');
                                }
                              }}
                              className={`px-2.5 py-1 rounded-lg text-[10px] font-bold transition-all border flex items-center gap-0.5 ${
                                mergedSortKey === opt.key && mergedSortKey !== 'custom'
                                  ? 'bg-slate-900 text-white border-slate-900'
                                  : 'bg-slate-50 text-slate-500 border-slate-200 hover:border-slate-300'
                              }`}>
                              {opt.label}
                              {mergedSortKey === opt.key && mergedSortKey !== 'custom' && (
                                <span className="ml-0.5 text-[9px]">
                                  {mergedSortDir === 'desc' ? '▼' : '▲'}
                                </span>
                              )}
                            </button>
                          ))}
                          <button
                            onClick={() => {
                              setDraggedIdx(null);
                              setDragOverIdx(null);
                              dragOverIdxRef.current = null;
                              if (mergedSortKey === 'custom') {
                                // 직접정렬 해제 → 평가금액 기본 복귀
                                setMergedSortKey('value');
                                setMergedSortDir('desc');
                                setMergedCustomOrder([]);
                              } else {
                                handleEnterCustomSort();
                              }
                            }}
                            className={`px-2.5 py-1 rounded-lg text-[10px] font-bold transition-all border ${
                              mergedSortKey === 'custom'
                                ? 'bg-indigo-600 text-white border-indigo-600'
                                : 'bg-slate-50 text-slate-500 border-slate-200 hover:border-slate-300'
                            }`}>
                            {mergedSortKey === 'custom' ? '정렬 해제' : '직접정렬'}
                          </button>
                        </div>
                      </div>

                      {/* 직접정렬 안내 */}
                      {mergedSortKey === 'custom' && (
                        <div className="mb-3 px-3 py-2 bg-indigo-50 border border-indigo-100 rounded-xl text-[10px] text-indigo-700 font-bold flex items-center gap-1.5">
                          <GripVertical size={12} /> 행을 길게 누르거나 잡아서 끌어 순서를 변경하세요.
                        </div>
                      )}

                      {/* 종목 리스트 */}
                      <div className="space-y-0" ref={mergedListRef}>
                        {sortedMergedAssets.map((a, idx) => {
                          const isPos = a.returnAmt >= 0;
                          const retColor = a.returnAmt > 0
                            ? "text-rose-500"
                            : a.returnAmt < 0
                            ? "text-blue-500"
                            : "text-slate-400";

                          const isDragging  = mergedSortKey === 'custom' && draggedIdx === idx;
                          const isDropTarget = mergedSortKey === 'custom' && dragOverIdx === idx && draggedIdx !== idx;

                          return (
                            <div key={a.mergeKey}
                              data-merged-drag-idx={idx}
                              draggable={mergedSortKey === 'custom'}
                              onDragStart={() => handleDragStart(idx)}
                              onDragOver={(e) => mergedSortKey === 'custom' && handleDragOver(e, idx)}
                              onDrop={() => mergedSortKey === 'custom' && handleDrop(idx)}
                              onDragEnd={handleDragEnd}
                              onTouchStart={() => mergedSortKey === 'custom' && handleTouchStart(idx)}
                              onTouchEnd={() => mergedSortKey === 'custom' && handleTouchEnd()}
                              className={[
                                "flex items-center gap-2 py-2.5 border-b border-slate-50 last:border-0 transition-all duration-150",
                                isDragging   ? "opacity-40 bg-slate-50 rounded-xl"      : "",
                                mergedSortKey === 'custom' ? "cursor-grab active:cursor-grabbing" : "",
                              ].filter(Boolean).join(" ")}
                              style={isDropTarget ? {
                                borderTopWidth: '2px',
                                borderTopStyle: 'solid',
                                borderTopColor: '#818cf8', /* indigo-400 */
                                borderBottomWidth: '0px'
                              } : {}}>

                              {/* 드래그 핸들 (직접정렬 모드에서만) */}
                              {mergedSortKey === 'custom' && (
                                <div className="flex-shrink-0 text-slate-300 hover:text-slate-500 transition-colors pl-0.5">
                                  <GripVertical size={16} />
                                </div>
                              )}

                              {/* 색상 점 + 종목 정보 */}
                              <div className="flex items-center gap-2.5 min-w-0 flex-1">
                                <span className="w-2.5 h-2.5 rounded-full flex-shrink-0"
                                  style={{ background: a.color }} />
                                <div className="min-w-0">
                                  <p className="text-xs font-bold text-slate-800 truncate leading-tight"
                                    style={{ maxWidth: "160px" }}>
                                    {a.name}
                                  </p><p className="text-[9px] text-slate-400">{a.code || (a.isCash ? "예수금 합산" : "직접 입력 자산")}{a.priceMismatch ? " · 계좌별 입력가격 다름" : ""}</p>
                                  <p className="text-[10px] text-slate-400 leading-tight">
                                    {a.isCash ? "계좌별 현금잔액 합계" : <>{a.totalQuantity.toLocaleString("ko-KR")}주 · 평단 ₩{a.avgPrice.toLocaleString("ko-KR")}</>}
                                  </p>
                                </div>
                              </div>

                              {/* 금액 + 손익 */}
                              <div className="text-right flex-shrink-0">
                                <p className="text-xs font-bold text-slate-800">

                              </div>
                            </div>

                        <span className="text-xs font-bold text-slate-500">전체 합계</span>
                        <span className="text-sm font-black text-slate-800">
                          ₩{fmt(reportStats.totalMergedValue)}
                        </span>
                      </div>
                    </div>
                  </div>
                )}

            <div className="fixed inset-0 z-[60] flex items-end sm:items-center justify-center bg-slate-900/60 p-4 backdrop-blur-sm">
              <div className="bg-white w-full max-w-2xl rounded-t-3xl sm:rounded-3xl flex flex-col shadow-2xl overflow-hidden" style={{ maxHeight: '90vh' }}>
                <div className="p-6 border-b border-slate-100 flex justify-between items-start">
                  <div>
                    <p className="text-xs font-bold text-slate-400 mb-1">{curAcc.label} 정기 리밸런싱</p>
                    <h2 className="text-xl font-black text-slate-800">매도 / 매수 주문서</h2>
                  </div>
                  <button onClick={() => setShowRebalance(false)} className="p-2 rounded-full bg-slate-100 text-slate-500"><X size={18} /></button>
                </div>
                <div className="p-4 sm:p-6 overflow-y-auto space-y-3 bg-slate-50 flex-1">
                  {buyLogic.fullRebalancePlan.length === 0 ? (
                    <div className="text-center py-10 text-slate-400 text-sm font-bold border-2 border-dashed border-slate-200 rounded-2xl bg-white">현재 비중이 완벽합니다! 🎉</div>
                  ) : buyLogic.fullRebalancePlan.map((item, i) => {
                    const sell = item.shares < 0;
                    const isParking = item.isParkingLiquidation;
                    return (
                      <div key={i} className={`rounded-2xl border p-4 shadow-sm ${isParking ? 'bg-amber-50 border-amber-200' : 'bg-white border-slate-200'}`} style={!isParking ? { borderColor: sell ? '#bfdbfe' : '#fecdd3' } : {}}>
                        <div className="flex justify-between gap-3 mb-3">
                          <div className="min-w-0">
                            <p className="text-[10px] font-bold text-slate-400">{item.name}</p>
                            <p className="text-sm font-bold text-slate-800 truncate">{item.assetName}</p>
                          </div>
                          <span className={`flex-shrink-0 text-sm font-black px-3 py-1.5 rounded-xl border ${isParking ? 'bg-amber-100 text-amber-700 border-amber-200' : sell ? 'bg-blue-50 text-blue-700 border-blue-200' : 'bg-rose-50 text-rose-700 border-rose-200'}`}>
                            {isParking ? "파킹 매도" : (sell ? "매도" : "매수")} {fmt(Math.abs(item.shares))}주
                          </span>
                        </div>
                        <div className="grid grid-cols-3 gap-2 text-xs">
                          <div className="bg-white/50 rounded-lg p-2.5 text-center"><p className="text-[10px] font-bold text-slate-400 mb-0.5">비중 조절</p><p className="font-bold text-slate-700">{isParking ? "재원 활용" : `${item.currentWeight}% → ${item.targetWeight}%`}</p></div>
                          <div className="bg-white/50 rounded-lg p-2.5 text-center"><p className="text-[10px] font-bold text-slate-400 mb-0.5">현재가</p><p className="font-bold text-slate-700">₩{fmt(item.currentPrice)}</p></div>
                          <div className="bg-white/50 rounded-lg p-2.5 text-center"><p className="text-[10px] font-bold text-slate-400 mb-0.5">예상금액</p><p className="font-black" style={{ color: sell ? '#2563eb' : '#e11d48' }}>{sell ? "-" : "+"}₩{fmt(Math.abs(item.shares * item.currentPrice))}</p></div>
                        </div>
                        {!isParking && sell && item.profit > 0 && <div className="mt-2 text-[11px] font-bold text-rose-500 bg-rose-50 rounded-lg px-3 py-2 border border-rose-100 inline-block">예상 실현 차익 (과세이연): +₩{fmt(item.profit)}</div>}
                      </div>
                    );
                  })}
                  {buyLogic.fullRebalancePlan.length > 0 && (
                    <React.Fragment>
                      <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 text-[11px] text-amber-800 shadow-sm mt-4">
                        <p className="font-bold flex items-center gap-1.5 mb-2"><Info size={14} /> 리밸런싱 세금 참고사항</p>
                        <ul className="list-disc pl-4 space-y-1 opacity-90">
                          <li><strong>파란색(매도) 주문을 먼저</strong> 체결하여 예수금을 확보하세요.</li>
                          <li><strong>과세이연 계좌</strong>이므로 매매차익에 대한 세금은 인출 시점까지 없습니다.</li>
                          <li>세액공제를 받지 않은 초과 납입분은 <strong>납입확인서 및 불공제 확인서</strong> 제출 시 과세 제외됩니다.</li>
                        </ul>
                      </div>
                      <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                        <p className="text-xs text-slate-500 mb-3">기존 예수금 ₩{fmt(totalInvestableCash)} · 매수 후 예상 잔액 ₩{fmt(Math.floor(buyLogic.fullRemainingCash))}. 매수에도 수수료 여유금 0.2%를 반영했습니다.</p>
                        <div className="flex justify-between items-center mb-2.5 text-xs"><span className="text-slate-500 font-bold">총 매도 예상 차익 (과세이연)</span><span className="font-black text-rose-500">₩{fmt(buyLogic.totalProfit)}</span></div>
                        <div className="flex justify-between items-center mb-2.5 text-xs"><span className="text-slate-500 font-bold">예상 매도 수수료 (~0.2%)</span><span className="font-black text-slate-400">-₩{fmt(Math.round(buyLogic.fee))}</span></div>
                        <div className="border-t border-slate-100 pt-3 mt-1 flex justify-between items-center">
                          <span className="text-sm font-black text-slate-800">매도 후 확보 예수금</span>
                          <span className="text-lg font-black text-blue-600">₩{fmt(Math.round(buyLogic.totalSellAmt - buyLogic.fee))}</span>
                        </div>
                      </div>
                    </React.Fragment>
                  )}
                </div>
                <div className="p-4 sm:p-6 border-t border-slate-100 bg-white">
                  <button onClick={() => setShowRebalance(false)} className="w-full py-4 bg-slate-900 text-white font-black text-sm rounded-2xl shadow-lg active:scale-95 transition-all">확인 및 닫기</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // @section bootstrap | React 앱 실행
    const rootElement = document.getElementById("root");
    const root = createRoot(rootElement);
    root.render(<App />);
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("/pension-portfolio/service-worker.js", { scope: "/pension-portfolio/" })
          .then((reg) => console.log("[PWA] 서비스 워커 등록됨:", reg.scope))
          .catch((err) => console.error("[PWA] 서비스 워커 등록 실패:", err));
      });
    }
  </script>
</body>
</html>
