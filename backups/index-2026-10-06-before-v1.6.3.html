    const cumulativeReturnRate = (value, principal) => {
      if (!Number.isFinite(value) || !Number.isFinite(principal) || principal <= 0) return null;
      const rate = (value - principal) / principal * 100;
      return Number.isFinite(rate) ? rate : null;
    };
    const formatReturnRate = (rate) => {
      if (rate === null) return "—";
      const rounded = Number(rate.toFixed(2));

    };

    const fmt = (n) => {
  const num = Number(n);

};

const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

// items를 CONCURRENCY개씩 묶어 동시 처리하고, 묶음 사이에만 짧게 대기 (프록시 rate-limit 회피)
const fetchWithConcurrency = async (items, worker, concurrency = 6, gapMs = 100) => {
  const results = [];
  for (let i = 0; i < items.length; i += concurrency) {
    const batch = items.slice(i, i + concurrency);
    const batchResults = await Promise.all(batch.map(worker));
    results.push(...batchResults);
    if (i + concurrency < items.length) await sleep(gapMs);
  }
  return results;
};

// 실패한 종목명 목록을 메시지용 문자열로 변환 (최대 max개까지 표시, 나머지는 "외 N건")
const formatFailedNames = (names, max = 3) => {
  if (names.length === 0) return "";
  if (names.length <= max) return names.join(", ");
  return `${names.slice(0, max).join(", ")} 외 ${names.length - max}건`;
};

const DEFAULT_COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#f43f5e', '#8b5cf6', '#06b6d4', '#ec4899'];

    // 혼합 자산군 관리용 상수
    // @section presets | 자산 분류·기본 계좌
    const MIXED_ASSET_CATEGORIES = ["주식+채권"];

      { label: "미국채권", color: "#8b5cf6" }, { label: "국내채권", color: "#10b981" }, 
      { label: "글로벌채권", color: "#14b8a6" },
      { label: "금", color: "#f59e0b" }, { label: "원자재", color: "#d97706" },

    // 자산군-유형 자동 매핑 상수
    const CATEGORY_ASSET_TYPE = {
      "국내주식":    "위험자산",
      "미국주식":    "위험자산",
      "중국주식":    "위험자산",
      "선진국주식":  "위험자산",
      "신흥국주식":  "위험자산",
      "금":          "위험자산",
      "원자재":      "위험자산",
      "리츠(부동산)":"위험자산",
      "미국채권":    "안전자산",
      "국내채권":    "안전자산",
      "글로벌채권":  "안전자산",
      "현금/단기채": "안전자산",
      // pension1 기본 자산군명 추가
      "S&P500":   "위험자산",
      "나스닥":   "위험자산",
      "CSI300":   "위험자산",
      "한국200":  "위험자산",
      "미국채":   "안전자산",
      "국고채":   "안전자산",
    };

    const PENSION1_DEFAULT_TARGET = [
      { name: "S&P500", value: 24, color: "#3b82f6" }, { name: "나스닥", value: 9, color: "#14b8a6" },
      { name: "CSI300", value: 13, color: "#ef4444" }, { name: "한국200", value: 8, color: "#6366f1" },
      { name: "미국채", value: 12, color: "#8b5cf6" }, { name: "국고채", value: 12, color: "#10b981" },

    ];

    const createDefaultDcIrp = () => ({
      limit: 0, color: "#f97316", label: "퇴직IRP (DC형)",
      rebalanceMonth: 7, rebalanceDay: 15, monthlyInput: 200000,
      employerMonthlyInput: 300000, accountKind: "dc", taxCreditEligible: false,
      targetPortfolio: [
        { name: "미국주식", value: 40, color: "#3b82f6" },
        { name: "주식+채권", value: 30, color: "#a855f7" },
        { name: "현금/단기채", value: 30, color: "#94a3b8" }
      ],
      assets: [
        { id: 1, category: "미국주식",   name: "KODEX 미국나스닥100",        code: "379810", quantity: 66,  price: 21100, currentPrice: 23855, assetType: "위험자산" },
        { id: 2, category: "주식+채권",  name: "TIGER 미국나스닥100채권혼합Fn", code: "435420", quantity: 45,  price: 12000, currentPrice: 13130, stockRatio: 40 },
        { id: 3, category: "현금/단기채",name: "TIGER 단기채권액티브",       code: "157450", quantity: 60,  price: 10200, currentPrice: 10250, assetType: "안전자산", parkingAsset: true },
      ], 
      contributions: [
        { id: 1, month: "2026-01", amount: 300000, type: "회사부담금", memo: "정기 회사부담금" },
        { id: 2, month: "2026-02", amount: 300000, type: "회사부담금", memo: "정기 회사부담금" },
        { id: 3, month: "2026-03", amount: 200000, type: "개인추가납입", memo: "개인 추가 납입" }
      ], 
      pastContributions: [
        { id: 1, year: 2024, amount: 3600000, dividend: 50000 }, 
        { id: 2, year: 2025, amount: 3600000, dividend: 120000 }
      ]
    });

    const normalizeAccounts = (raw) => {
      const next = { ...raw };
      if (!next.dcIrp) {
        next.dcIrp = createDefaultDcIrp();
      } else {
        next.dcIrp = { ...createDefaultDcIrp(), ...next.dcIrp };
      }

      Object.keys(next).forEach(accKey => {
        const acc = next[accKey];
        if (!acc || typeof acc !== 'object') return;

        const safeAssets = Array.isArray(acc.assets) ? acc.assets : [];

        // 원본 변이 방지: 항상 새 객체를 생성하여 next에 재할당
        next[accKey] = {
          ...acc,
          assets: safeAssets.map(asset => {
            const updated = { ...asset };
            if (updated.parkingAsset === undefined) {
              updated.parkingAsset = false;
            }
            if (MIXED_ASSET_CATEGORIES.includes(updated.category) && updated.stockRatio === undefined) {
              updated.stockRatio = 30;
            }
            return updated;
          }),
          contributions:     Array.isArray(acc.contributions)     ? acc.contributions     : [],
          pastContributions: Array.isArray(acc.pastContributions) ? acc.pastContributions : [],
          targetPortfolio:   Array.isArray(acc.targetPortfolio)   ? acc.targetPortfolio   : [],
        };
      });

      return next;
    };

    // @section state-validation | 저장 데이터 검증·원금 마감
    const ACCOUNT_KEYS = ["pension1", "pension2", "irp", "dcIrp", "isa"];
    const STORAGE_KEY = "retireLab_state_v4";
    const isRecord = v => v !== null && typeof v === "object" && !Array.isArray(v);
    const finiteNonnegative = v => typeof v === "number" && Number.isFinite(v) && v >= 0;
    const validDate = (value, allowMonth = false) => {
      if (typeof value !== "string" || !(allowMonth ? /^\d{4}-\d{2}(?:-\d{2})?$/ : /^\d{4}-\d{2}-\d{2}$/).test(value)) return false;
      const [y, m, day = 1] = value.split("-").map(Number);
      const d = new Date(y, m - 1, day);
      return y >= 1900 && d.getFullYear() === y && d.getMonth() === m - 1 && d.getDate() === day;
    };
    function validateState(raw, settings) {
      if (!isRecord(raw) || !isRecord(settings) || typeof settings.userName !== "string" || !["5500이하", "5500초과"].includes(settings.incomeLevel)) throw new Error("계좌 또는 사용자 설정을 확인해주세요.");
      for (const key of ACCOUNT_KEYS.filter(k => k !== "dcIrp" || raw[k] !== undefined)) {
        const a = raw[key];
        if (!isRecord(a) || typeof a.label !== "string" || !Array.isArray(a.assets) || !Array.isArray(a.contributions) || !Array.isArray(a.pastContributions) || !Array.isArray(a.targetPortfolio)) throw new Error(`${key}: 필수 계좌 항목이 없습니다.`);
        if (!Number.isInteger(a.rebalanceMonth) || a.rebalanceMonth < 1 || a.rebalanceMonth > 12 || !Number.isInteger(a.rebalanceDay) || a.rebalanceDay < 1 || a.rebalanceDay > 31 || !finiteNonnegative(a.monthlyInput) || !finiteNonnegative(a.limit)) throw new Error(`${key}: 계좌 설정 값이 올바르지 않습니다.`);
        if (a.availableCash != null && !finiteNonnegative(a.availableCash)) throw new Error(`${key}: 실제 예수금이 올바르지 않습니다.`);
        if (a.preferredBuyAssets !== undefined && !isRecord(a.preferredBuyAssets)) throw new Error(`${key}: 매수 종목 설정이 올바르지 않습니다.`);
        const ids = new Set();
        for (const asset of a.assets) {
          if (!isRecord(asset) || !["string", "number"].includes(typeof asset.id) || ids.has(asset.id) || typeof asset.name !== "string" || typeof asset.category !== "string" || typeof asset.code !== "string" || !Number.isInteger(asset.quantity) || asset.quantity < 0 || !finiteNonnegative(asset.price) || !finiteNonnegative(asset.currentPrice) || (asset.stockRatio !== undefined && (!finiteNonnegative(asset.stockRatio) || asset.stockRatio > 100))) throw new Error(`${key}: 종목 수량·가격·식별자를 확인해주세요.`);
          ids.add(asset.id);
        }
        for (const c of a.contributions) if (!isRecord(c) || !validDate(c.month, true) || !finiteNonnegative(c.amount) || !["입금", "개인추가납입", "회사부담금", "배당"].includes(c.type)) throw new Error(`${key}: 납입 날짜 또는 금액을 확인해주세요.`);
        const years = new Set();
        for (const c of a.pastContributions) {
          if (!isRecord(c) || !Number.isInteger(c.year) || c.year < 1900 || years.has(c.year) || !finiteNonnegative(c.amount) || !finiteNonnegative(c.dividend)) throw new Error(`${key}: 과거 합계가 올바르지 않습니다.`);
          years.add(c.year);
        }
        for (const t of a.targetPortfolio) if (!isRecord(t) || typeof t.name !== "string" || !finiteNonnegative(t.value) || t.value > 100) throw new Error(`${key}: 목표 비중을 확인해주세요.`);
      }
      const accounts = normalizeAccounts(raw);
      if (raw.dcIrp === undefined) accounts.dcIrp = { ...createDefaultDcIrp(), assets: [], contributions: [], pastContributions: [], monthlyInput: 0 };
      return { accounts, global: { ...settings } };
    }
    function validateBackup(d) {
      if (!isRecord(d) || !["1.0", "1.1", "1.2"].includes(String(d.schemaVersion))) throw new Error("지원하지 않는 백업 버전입니다.");
      const state = validateState(d.accounts, d.global);
      const history = d.history === undefined ? [] : d.history;
      if (!Array.isArray(history)) throw new Error("자산 이력이 올바르지 않습니다.");
      const dates = new Set();
      for (const row of history) {
        if (!isRecord(row) || !validDate(row.date) || dates.has(row.date) || !isRecord(row.accounts)) throw new Error("자산 이력 날짜 또는 계좌가 올바르지 않습니다.");
        dates.add(row.date);
        for (const field of ["totalValue", "totalPrincipal", "totalDividend"]) if (!finiteNonnegative(row[field])) throw new Error("자산 이력 합계가 올바르지 않습니다.");
        for (const a of Object.values(row.accounts)) if (!isRecord(a) || !finiteNonnegative(a.value) || !finiteNonnegative(a.principal) || !finiteNonnegative(a.dividend)) throw new Error("계좌별 이력이 올바르지 않습니다.");
      }
      return { ...state, history };
    }
    function saveState(accounts, global) {
      // 하나의 키에 기록하므로 계좌와 설정이 따로 저장되는 문제를 방지합니다.
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ accounts, global }));
    }
    function downloadJson(payload, filename) {
      const url = URL.createObjectURL(new Blob([JSON.stringify(payload)], { type: "application/json" }));
      const a = document.createElement("a"); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }
    function contributionTotals(acc) {
      return {
        principal: acc.pastContributions.reduce((n, x) => n + x.amount, 0) + acc.contributions.filter(x => x.type !== "배당").reduce((n, x) => n + x.amount, 0),
        dividend: acc.pastContributions.reduce((n, x) => n + x.dividend, 0) + acc.contributions.filter(x => x.type === "배당").reduce((n, x) => n + x.amount, 0)
      };
    }
    function settleAccount(acc, year) {
      const older = acc.contributions.filter(c => Number(c.month.slice(0, 4)) < year);
      if (!older.length) throw new Error("마감할 과거 연도 데이터가 없습니다.");
      // 이미 누적합계에 포함된 금액인지 알 수 없는 중복 연도는 삭제하지 않고 중단합니다.
      if (older.some(c => acc.pastContributions.some(p => p.year === Number(c.month.slice(0, 4))))) throw new Error("과거 합계와 월별 내역에 같은 연도가 있습니다. 중복 여부 확인 전에는 마감할 수 없습니다.");
      const sums = new Map();
      older.forEach(c => {
        const y = Number(c.month.slice(0, 4));
        const v = sums.get(y) || { id: `settled-${y}`, year: y, amount: 0, dividend: 0 };
        if (c.type === "배당") v.dividend += c.amount; else v.amount += c.amount;
        sums.set(y, v);
      });
      const next = { ...acc, pastContributions: [...acc.pastContributions, ...sums.values()], contributions: acc.contributions.filter(c => Number(c.month.slice(0, 4)) >= year) };
      const before = contributionTotals(acc), after = contributionTotals(next);
      if (Math.abs(before.principal - after.principal) > 0.001 || Math.abs(before.dividend - after.dividend) > 0.001) throw new Error("마감 전후 합계가 달라 작업을 중단했습니다.");
      return next;
    }

    // 파킹형 자산 및 분리 계산용 Helper 함수
    // @section asset-math | 자산 평가·위험자산·리밸런싱 날짜
    const isParkingAsset = (a) => Boolean(a.parkingAsset);
    const getAssetMarketValue = (a) => (Number(a.quantity) || 0) * (Number(a.currentPrice || a.price) || 0);
    const getParkingAssetValue = (assets) => assets.filter(isParkingAsset).reduce((sum, a) => sum + getAssetMarketValue(a), 0);
    const getAllocationAssets = (assets) => assets.filter(a => !isParkingAsset(a));
    const getAllocationBaseValue = (assets) => getAllocationAssets(assets).reduce((sum, a) => sum + getAssetMarketValue(a), 0);

    // 규정용 비중은 사용자가 지정한 상품 분류를 적용합니다.
    const getRiskWeight = a => a.assetType === "위험자산" ? 1 : 0;
    const getEquityExposureWeight = a => {
      if (MIXED_ASSET_CATEGORIES.includes(a.category)) return Math.max(0, Math.min(100, Number(a.stockRatio ?? 30))) / 100;
      return /주식|S&P500|나스닥|CSI300|한국200/.test(a.category) ? 1 : 0;
    };
    function nextRebalance(month, day, now = new Date()) {
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const makeDate = year => new Date(year, month - 1, Math.min(day, new Date(year, month, 0).getDate()));
      let target = makeDate(today.getFullYear());
      if (target < today) target = makeDate(today.getFullYear() + 1);
      const utcDay = d => Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
      return { date: localDateKey(target), days: Math.round((utcDay(target) - utcDay(today)) / 86400000) };
    }

    // @section order-plan | 매수·매도·수수료 계획
    const ORDER_FEE_RATE = 0.002; // 수수료 여유금; 실제 증권사 수수료와 다를 수 있음
    const isCashAsset = a => isParkingAsset(a) && !String(a.code || "").trim() && a.name.trim() === "예수금";
    const getCashValue = assets => assets.filter(isCashAsset).reduce((n, a) => n + getAssetMarketValue(a), 0);
    const getParkingSecuritiesValue = assets => assets.filter(a => isParkingAsset(a) && !isCashAsset(a)).reduce((n, a) => n + getAssetMarketValue(a), 0);
    const orderPrice = a => Number(a.currentPrice || a.price) || 0;
    function allocateBuyOrders(items, budget, limit = Infinity) {
      const eligible = items.filter(x => x.deficit > 0 && x.cp > 0).sort((a, b) => b.deficit - a.deficit).slice(0, limit);
      const deficitTotal = eligible.reduce((n, x) => n + x.deficit, 0);
      const orders = [];
      let cash = Math.max(0, budget);
      eligible.forEach(item => {
        const allowance = Math.min(budget * item.deficit / deficitTotal, cash);
        const shares = Math.min(Math.floor(allowance / (item.cp * (1 + ORDER_FEE_RATE))), Math.floor(item.deficit / item.cp));
        if (shares > 0) {
          const cost = shares * item.cp, fee = cost * ORDER_FEE_RATE;
          orders.push({ ...item, shares, cost, fee }); cash -= cost + fee;
        }
      });
      // 잔여금도 부족 금액·수수료 한도 내에서만 배분합니다.
      for (const item of eligible) {
        const existing = orders.find(o => o.assetId === item.assetId);
        const spent = existing ? existing.cost : 0;
        const shares = Math.min(Math.floor((cash + 1e-8) / (item.cp * (1 + ORDER_FEE_RATE))), Math.floor((item.deficit - spent + 1e-8) / item.cp));
        if (shares <= 0) continue;
        const cost = shares * item.cp, fee = cost * ORDER_FEE_RATE;
        if (existing) { existing.shares += shares; existing.cost += cost; existing.fee += fee; }
        else orders.push({ ...item, shares, cost, fee });
        cash -= cost + fee;
      }
      return { orders, remainingCash: Math.max(0, cash) };
    }
    function calculateBuyPlan(acc, actualCash, parkingRatio = 0) {
      const allocationBaseValue = getAllocationBaseValue(acc.assets);
      const planErrors = [];
      const targetSum = acc.targetPortfolio.reduce((n, t) => n + Number(t.value || 0), 0);
      const names = acc.targetPortfolio.map(t => t.name.trim());
      const invalidTarget = Math.abs(targetSum - 100) > 0.000001 || new Set(names).size !== names.length || acc.targetPortfolio.some(t => !finiteNonnegative(t.value) || !t.name.trim());
      const empty = { currentPortfolio: [], fullRebalancePlan: [], buyOrders: [], remainingCash: actualCash, totalProfit: 0, fee: 0, totalSellAmt: 0, deviationData: [], invalidTarget, deployParkingCash: 0, generatedParkingSellOrders: [], deployCash: actualCash, planErrors };
      if (invalidTarget || !acc.targetPortfolio.some(t => t.value > 0)) return empty;
      const targets = acc.targetPortfolio.filter(t => t.name !== "현금/단기채" || acc.assets.some(a => !isParkingAsset(a) && a.category === t.name));
      const activeSum = targets.reduce((n, t) => n + t.value, 0);
      if (activeSum <= 0) return { ...empty, invalidTarget: true };
      const categories = [...targets.map(t => ({ ...t, targetWeight: t.value / activeSum * 100 }))];
      acc.assets.filter(a => !isParkingAsset(a)).forEach(a => {
        if (!categories.some(t => t.name === a.category)) categories.push({ name: a.category, targetWeight: 0, color: "#94a3b8" });
      });
      const representative = category => {
        const candidates = acc.assets.filter(a => !isParkingAsset(a) && a.category === category);
        const selectedId = (acc.preferredBuyAssets || {})[category];
        return candidates.find(a => String(a.id) === String(selectedId)) || candidates[0];
      };
      const currentPortfolio = categories.map(t => {
        const categoryValue = acc.assets.filter(a => !isParkingAsset(a) && a.category === t.name).reduce((n, a) => n + getAssetMarketValue(a), 0);
        if (t.targetWeight > 0 && !representative(t.name)) planErrors.push(`${t.name}: 매수할 종목을 등록해주세요.`);
        return { ...t, categoryValue, value: allocationBaseValue > 0 ? categoryValue / allocationBaseValue * 100 : 0 };
      });
      const generatedParkingSellOrders = [];
      let requested = Math.floor(getParkingSecuritiesValue(acc.assets) * Math.max(0, Math.min(100, parkingRatio)) / 100);
      for (const a of acc.assets.filter(a => isParkingAsset(a) && !isCashAsset(a))) {
        const cp = orderPrice(a);
        if (requested <= 0 || cp <= 0) continue;
        const shares = Math.min(Math.floor(a.quantity), Math.floor(requested / cp));
        if (shares > 0) {
          generatedParkingSellOrders.push({ name: a.category, assetName: a.name, assetId: a.id, shares: -shares, currentPrice: cp, currentWeight: 0, targetWeight: 0, profit: shares * (cp - a.price), isParkingLiquidation: true });
          requested -= shares * cp;
        }
      }
      const parkingGross = generatedParkingSellOrders.reduce((n, o) => n + -o.shares * o.currentPrice, 0);
      const deployParkingCash = parkingGross * (1 - ORDER_FEE_RATE);
      const deployCash = Math.max(0, actualCash) + deployParkingCash;
      const targetBase = allocationBaseValue + deployCash;
      const buyItems = currentPortfolio.map(p => {
        const a = representative(p.name);
        return { name: p.name, assetName: a?.name || p.name, assetId: a?.id, cp: a ? orderPrice(a) : 0, deficit: targetBase * p.targetWeight / 100 - p.categoryValue };
      });
      const buyOnly = allocateBuyOrders(buyItems, deployCash, 3);
      const normalSells = [];
      currentPortfolio.forEach(p => {
        let excess = Math.max(0, p.categoryValue - targetBase * p.targetWeight / 100);
        for (const a of acc.assets.filter(a => !isParkingAsset(a) && a.category === p.name)) {
          const cp = orderPrice(a);
          if (cp <= 0) continue;
          const shares = Math.min(Math.floor(a.quantity), Math.floor((excess + 1e-8) / cp));
          if (shares > 0) {
            normalSells.push({ name: p.name, assetName: a.name, assetId: a.id, shares: -shares, currentPrice: cp, currentWeight: p.value.toFixed(1), targetWeight: p.targetWeight.toFixed(1), profit: shares * (cp - a.price), isParkingLiquidation: false });
            excess -= shares * cp;
          }
        }
      });
      const saleOrders = [...generatedParkingSellOrders, ...normalSells];
      const totalSellAmt = saleOrders.reduce((n, o) => n + -o.shares * o.currentPrice, 0);
      const fee = totalSellAmt * ORDER_FEE_RATE;
      const fullBuys = allocateBuyOrders(buyItems, Math.max(0, actualCash) + totalSellAmt - fee);
      const fullRebalancePlan = [...saleOrders, ...fullBuys.orders.map(o => {
        const p = currentPortfolio.find(p => p.name === o.name);
        return { ...o, currentPrice: o.cp, currentWeight: p.value.toFixed(1), targetWeight: p.targetWeight.toFixed(1), profit: 0, isParkingLiquidation: false };
      })];
      let priority = 0;
      const deviationData = currentPortfolio.map(p => {
        const matches = acc.assets.filter(a => !isParkingAsset(a) && a.category === p.name);
        return { ...p, currentWeight: p.value, gap: p.value - p.targetWeight, deficitAmount: allocationBaseValue * p.targetWeight / 100 - p.categoryValue, assetName: matches.length > 1 ? `${matches[0].name} 외 ${matches.length - 1}개` : matches[0]?.name || "" };
      }).sort((a, b) => b.deficitAmount - a.deficitAmount).map(p => ({ ...p, priority: p.deficitAmount > 0 ? ++priority : null }));
      return { currentPortfolio, fullRebalancePlan, buyOrders: buyOnly.orders, remainingCash: buyOnly.remainingCash, totalProfit: normalSells.reduce((n, o) => n + o.profit, 0), fee, totalSellAmt, deviationData, invalidTarget, deployParkingCash, generatedParkingSellOrders, deployCash, planErrors, fullRemainingCash: fullBuys.remainingCash };
    }

    // @section tip | 공통 도움말
    function Tip({ text }) {
      const [show, setShow] = useState(false);
      const ref = useRef(null);

      useEffect(() => {
        if (!show) return;
        const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setShow(false); };
        document.addEventListener("mousedown", handler);
        document.addEventListener("touchstart", handler);
        return () => { document.removeEventListener("mousedown", handler); document.removeEventListener("touchstart", handler); };
      }, [show]);

      return (
        <div className="relative inline-flex items-center" ref={ref}>
          <button
            type="button"
            onClick={(e) => { e.stopPropagation(); setShow(s => !s); }}
            className="w-[18px] h-[18px] rounded-full bg-slate-200 text-slate-500 text-[10px] font-black flex items-center justify-center hover:bg-indigo-100 hover:text-indigo-600 transition-colors flex-shrink-0 leading-none"
          >?</button>
          {show && (
            <div className="absolute left-0 top-6 z-[60] w-60 bg-slate-900 text-white text-[11px] font-medium leading-relaxed rounded-2xl p-3.5 shadow-2xl border border-slate-700 whitespace-pre-wrap">
              <div className="absolute -top-1.5 left-3.5 w-3 h-3 bg-slate-900 rotate-45 border-l border-t border-slate-700" />
              {text}
            </div>
          )}
        </div>
      );
    }

    // ── 자산 추이 SVG 라인차트 ──
    // @section aggregation | 종목코드별 계좌 합산
    function mergeAccountAssets(accounts, keys = ACCOUNT_KEYS) {
      const grouped = new Map();
      for (const accountKey of keys) {
        const acc = accounts[accountKey];
        if (!acc) continue;
        for (const a of acc.assets || []) {
          const code = String(a.code || "").trim().toUpperCase();
          const mergeKey = code ? `code:${code}` : isCashAsset(a) ? "cash:KRW" : `manual:${accountKey}:${a.id}`;
          if (!grouped.has(mergeKey)) grouped.set(mergeKey, { mergeKey, name: a.name || "종목명 없음", code, category: a.category || "", totalMarketValue: 0, totalBookValue: 0, totalQuantity: 0, color: null, isCash: isCashAsset(a), prices: new Set() });
          const item = grouped.get(mergeKey);
          item.totalMarketValue += getAssetMarketValue(a);
          item.totalBookValue += (Number(a.quantity) || 0) * (Number(a.price) || 0);
          item.totalQuantity += Number(a.quantity) || 0;
          if (a.quantity > 0 && code) item.prices.add(orderPrice(a));
          if (!item.color) item.color = (acc.targetPortfolio || []).find(t => t.name === a.category)?.color || null;
        }
      }
      const total = [...grouped.values()].reduce((n, a) => n + a.totalMarketValue, 0);
      return [...grouped.values()].sort((a, b) => b.totalMarketValue - a.totalMarketValue).map((a, i) => ({
        mergeKey: a.mergeKey, name: a.name, code: a.code, category: a.category, isCash: a.isCash,
        totalMarketValue: a.totalMarketValue, totalQuantity: a.totalQuantity,
        avgPrice: a.totalQuantity > 0 ? Math.round(a.totalBookValue / a.totalQuantity) : 0,
        returnAmt: a.totalMarketValue - a.totalBookValue,
        returnRate: a.totalBookValue > 0 ? (a.totalMarketValue - a.totalBookValue) / a.totalBookValue * 100 : 0,
        pct: total > 0 ? Number((a.totalMarketValue / total * 100).toFixed(1)) : 0,
        color: a.color || DEFAULT_COLORS[i % DEFAULT_COLORS.length], priceMismatch: a.prices.size > 1
      }));
    }
    // @section quote-status | 가격 갱신 상태
    function quoteStatus(asset, now = new Date()) {
      if (!String(asset.code || "").trim()) return { text: "수동 입력", today: false };
      const failed = Number.isFinite(Date.parse(asset.priceFetchFailedAt));
      if (asset.priceSource === "manual") return { text: failed ? "조회 실패 · 직접 입력값 사용" : "현재가 직접 입력", today: false };
      const parsed = Date.parse(asset.priceUpdatedAt);
      if (!Number.isFinite(parsed)) return { text: failed ? "조회 실패 · 기존 입력값 사용" : "조회 기록 없음 · 입력값 사용", today: false };
      const date = new Date(parsed);
      const today = localDateKey(date) === localDateKey(now);
      return { text: `${failed ? "조회 실패 · 마지막 성공 " : "조회 "}${date.toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })}`, today: today && !failed };
    }

    // @section history-chart | 자산 추이 계산·차트
    function historyPoints(history, accountKey, days, now = new Date()) {
      const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
      const byDate = new Map();
      for (const row of Array.isArray(history) ? history : []) {
        if (!row || !validDate(row.date)) continue;
        const [y, m, d] = row.date.split("-").map(Number);
        const day = Date.UTC(y, m - 1, d);
        const age = (today - day) / 86400000;
        if (age < 0 || age > days) continue;
        const values = accountKey === "total" ? { value: row.totalValue, principal: row.totalPrincipal, dividend: row.totalDividend } : row.accounts?.[accountKey];
        if (!values || ![values.value, values.principal, values.dividend].every(finiteNonnegative)) continue;
        byDate.set(row.date, { date: row.date, day, value: values.value, principal: values.principal, dividend: values.dividend });
      }
      const rows = [...byDate.values()].sort((a, b) => a.day - b.day);
      if (rows.length <= 60) return rows;
      // 시작과 마지막 기록을 포함해 최대 60개 표시. 원본 이력은 삭제하지 않습니다.
      return Array.from({ length: 60 }, (_, i) => rows[Math.round(i * (rows.length - 1) / 59)]);
    }
    function HistoryChart({ history, accountKey }) {
      const [range, setRange] = React.useState("all");
      const [selection, setSelection] = React.useState(null);
      const RANGES = [
        { key: "day", label: "1개월", days: 30 },
        { key: "week", label: "3개월", days: 90 },
        { key: "month", label: "1년", days: 365 },
        { key: "year", label: "5년", days: 1825 },
        { key: "all", label: "전체", days: Infinity },
      ];
      const pts = historyPoints(history, accountKey, RANGES.find(r => r.key === range)?.days ?? Infinity);
      const selectedIndex = selection?.accountKey === accountKey && selection?.range === range ? pts.findIndex(p => p.date === selection.date) : -1;
      const index = selectedIndex >= 0 ? selectedIndex : pts.length - 1;
      const selected = pts[index];
      const select = i => { if (pts[i]) setSelection({ date: pts[i].date, accountKey, range }); };
      const W = 320, H = 180, padL = 8, padR = 8, padT = 14, padB = 22;
      const innerW = W - padL - padR, innerH = H - padT - padB;
      const n = pts.length;
      const firstDay = pts[0]?.day || 0, lastDay = pts[n - 1]?.day || 0;
      // 기록이 없는 날도 실제 날짜 간격을 반영합니다.
      const x = i => padL + (lastDay === firstDay ? innerW / 2 : innerW * (pts[i].day - firstDay) / (lastDay - firstDay));
      const maxV = Math.max(1, ...pts.flatMap(p => [p.value, p.principal, p.dividend]));
      const y = value => padT + innerH - innerH * value / maxV;
      const series = [
        { key: "value", color: "#3b82f6", label: "평가액" },
        { key: "principal", color: "#94a3b8", label: "원금" },
        { key: "dividend", color: "#f59e0b", label: "배당" },
      ];
      return (
        <div>
          <div className="flex flex-wrap gap-1 mb-3">{RANGES.map(r => <button key={r.key} aria-pressed={range === r.key} onClick={() => { setRange(r.key); setSelection(null); }} className={`px-2.5 py-2 rounded-lg text-xs font-bold ${range === r.key ? "bg-slate-800 text-white" : "bg-slate-100 text-slate-500"}`}>{r.label}</button>)}</div>
          {!n ? <div className="text-center text-xs text-slate-400 py-12">선택한 기간에 기록된 이력이 없습니다.</div> : (
            <div>
              <svg viewBox={`0 0 ${W} ${H}`} className="w-full" role="img" tabIndex={0} aria-label={`자산 추이, ${pts[0].date}부터 ${pts[n - 1].date}. 좌우 방향키로 날짜를 선택하세요.`} onKeyDown={e => { if (["ArrowLeft", "ArrowRight"].includes(e.key)) { e.preventDefault(); select(Math.max(0, Math.min(n - 1, index + (e.key === "ArrowRight" ? 1 : -1)))); } }}>
                {[0.25, 0.5, 0.75].map(f => <line key={f} x1={padL} x2={W - padR} y1={padT + innerH * f} y2={padT + innerH * f} stroke="#f1f5f9" />)}
                {series.map(item => <path key={item.key} d={pts.map((p, i) => `${i ? "L" : "M"} ${x(i).toFixed(1)} ${y(p[item.key]).toFixed(1)}`).join(" ")} fill="none" stroke={item.color} strokeWidth="2" strokeLinejoin="round" />)}
                {pts.map((p, i) => {
                  const left = i ? (x(i - 1) + x(i)) / 2 : padL;
                  const right = i < n - 1 ? (x(i) + x(i + 1)) / 2 : W - padR;
                  return <rect key={p.date} x={left} y={padT} width={Math.max(1, right - left)} height={innerH} fill="transparent" onPointerDown={() => select(i)} onPointerEnter={e => { if (e.pointerType === "mouse") select(i); }} />;
                })}
                <line x1={x(index)} x2={x(index)} y1={padT} y2={padT + innerH} stroke="#94a3b8" strokeDasharray="3 3" pointerEvents="none" />
                {series.map(item => <circle key={item.key} cx={x(index)} cy={y(selected[item.key])} r="3" fill={item.color} pointerEvents="none" />)}
                <text x={padL} y={H - 6} fontSize="9" fill="#64748b">{pts[0].date.slice(5)}</text>
                <text x={W - padR} y={H - 6} fontSize="9" fill="#64748b" textAnchor="end">{pts[n - 1].date.slice(5)}</text>
              </svg>
              <div className="bg-slate-50 rounded-xl p-3 border border-slate-100">
                <div className="flex justify-between items-center mb-2">
                  <button type="button" aria-label="이전 기록" disabled={index <= 0} onClick={() => select(index - 1)} className="px-3 py-2 rounded-lg bg-white border text-xs font-bold disabled:opacity-30">이전</button>
                  <span className="text-xs font-bold text-slate-700">{selected.date}</span>
                  <button type="button" aria-label="다음 기록" disabled={index >= n - 1} onClick={() => select(index + 1)} className="px-3 py-2 rounded-lg bg-white border text-xs font-bold disabled:opacity-30">다음</button>
                </div>
                {series.map(item => <div key={item.key} className="flex justify-between text-xs py-1"><span style={{ color: item.color }}>{item.label}</span><span className="font-bold text-slate-700">₩{fmt(selected[item.key])}</span></div>)}
              </div>
              <p className="text-[10px] text-slate-400 mt-2">차트를 터치하거나 이전·다음 버튼으로 기록을 확인하세요. 긴 기간은 최대 60개 기록을 표시합니다.</p>
            </div>
          )}
        </div>
      );
    }

    // @section charts | 비중 차트·수익 배지
    function DonutChart({ data, title, subtitle, centerLabel = "총 비중" }) {
      const rawTotal = data.reduce((s, d) => s + (Number(d.value) || 0), 0);
      const normalizeFactor = rawTotal > 0 ? 100 / rawTotal : 1;

      // 렌더 전 누적값 미리 계산 (순수 함수 유지)
      const segments = data.map((s) => {
        const val = (Number(s.value) || 0) * normalizeFactor;
        return { ...s, normalizedVal: val };
      }).reduce((acc, s) => {
        const offset = 100 - acc.cum;
        acc.items.push({ ...s, offset });
        acc.cum += s.normalizedVal;
        return acc;
      }, { items: [], cum: 0 }).items;

      return (
        <div className="flex flex-col items-center bg-white p-5 rounded-2xl border border-slate-200 shadow-sm w-full">
          <p className="text-sm font-bold text-slate-800">{title}</p>
          <p className="text-xs text-slate-400 mt-0.5 mb-4">{subtitle}</p>
          <div className="relative w-40 h-40 sm:w-48 sm:h-48">
            <svg viewBox="0 0 40 40" className="-rotate-90 w-full h-full">
              {segments.map((s, i) => (
                <circle key={i} cx="20" cy="20" r="15.92" fill="transparent"
                  stroke={s.color} strokeWidth="5.5"
                  strokeDasharray={`${s.normalizedVal} ${100 - s.normalizedVal}`}
                  strokeDashoffset={s.offset}
                  className="transition-all duration-500 ease-in-out" />
              ))}
            </svg>
            <div className="absolute inset-0 flex flex-col items-center justify-center">
              <span className="text-[10px] text-slate-400 font-semibold">{centerLabel}</span>
              <span className="text-xl font-black text-slate-800">{Math.round(rawTotal)}%</span>
            </div>
          </div>
          <div className="mt-4 w-full flex flex-wrap justify-center gap-1.5">
            {data.map((s, i) => (
              <span key={i} className="flex items-center text-[11px] bg-slate-50 border border-slate-100 px-2.5 py-1 rounded-full font-semibold text-slate-700">
                <span className="w-2 h-2 rounded-full mr-1.5 flex-shrink-0" style={{ background: s.color }}></span>
                {s.name} <span className="ml-1 font-bold text-slate-500">{s.value}%</span>
              </span>
            ))}
          </div>
        </div>
      );
    }

    function ReturnBadge({ amount, rate, size = "sm" }) {
      const pos = amount > 0, neg = amount < 0;
      const color = pos ? "text-rose-500" : neg ? "text-blue-500" : "text-slate-400";
      return (
        <div className={`text-right ${size === "lg" ? "text-base" : "text-xs"}`}>
          <span className={`font-black ${color}`}>{pos ? "+" : ""}{fmt(amount)}원</span>
          <span className={`ml-1 font-bold opacity-80 ${color}`}>({pos ? "▲" : neg ? "▼" : ""}{Math.abs(rate || 0).toFixed(2)}%)</span>
        </div>
      );
    }

    // @section selectors | 목표비중·자산 선택 컴포넌트
    function TargetCategorySelector({ t, i, curAcc, updateAcc }) {
      const [showDropdown, setShowDropdown] = useState(false);
      const [customMode, setCustomMode] = useState(false);
      const ref = useRef(null);

      useEffect(() => {
        if (!showDropdown) return;
        const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setShowDropdown(false); };
        document.addEventListener("mousedown", handler);
        document.addEventListener("touchstart", handler);
        return () => { document.removeEventListener("mousedown", handler); document.removeEventListener("touchstart", handler); };
      }, [showDropdown]);

      const handleChange = (newName, newColor) => {
        const oldName = t.name;
        updateAcc({
          targetPortfolio: curAcc.targetPortfolio.map((item, idx) => idx === i ? { ...item, name: newName, color: newColor || item.color } : item),
          assets: curAcc.assets.map(a => a.category === oldName ? { ...a, category: newName } : a)
        });
      };

      if (customMode) {
        return (
          <input type="text" value={t.name} autoFocus
            onChange={e => handleChange(e.target.value, t.color)}
            onBlur={() => setCustomMode(false)}
            className="w-full bg-transparent text-[10px] font-bold text-slate-700 outline-none border-b border-slate-200 focus:border-slate-400 py-0.5" 
          />
        );
      }

      return (
        <div className="relative w-full" ref={ref}>
          <button type="button" onClick={() => setShowDropdown(!showDropdown)} className="w-full bg-transparent text-[10px] font-bold text-slate-700 outline-none border-b border-slate-200 focus:border-slate-400 py-0.5 text-left flex justify-between items-center">

    // ── 자산 이력 저장소 (IndexedDB) ──
    // @section history-storage | IndexedDB 이력 저장·날짜 키
    const HISTORY_DB = "retireLab_history";
    const HISTORY_STORE = "snapshots";

    function openHistoryDB() {
      return new Promise((resolve, reject) => {
        let settled = false;
        const req = indexedDB.open(HISTORY_DB, 1);
        const finish = (error, db) => {
          if (settled) { if (db) db.close(); return; }
          settled = true; clearTimeout(timer);
          if (error) reject(error); else { db.onversionchange = () => db.close(); resolve(db); }
        };
        const timer = setTimeout(() => finish(new Error("이력 저장소 연결 시간이 초과됐습니다. 다른 탭을 닫고 다시 시도해주세요.")), 8000);
        req.onupgradeneeded = e => {
          if (settled) { req.transaction.abort(); return; }
          const db = e.target.result;
          if (!db.objectStoreNames.contains(HISTORY_STORE)) db.createObjectStore(HISTORY_STORE, { keyPath: "date" });
        };
        req.onsuccess = e => finish(null, e.target.result);
        req.onerror = e => finish(e.target.error || new Error("이력 저장소를 열지 못했습니다."));
        req.onblocked = () => finish(new Error("다른 탭이 이력 저장소를 사용 중입니다. 다른 탭을 닫고 다시 시도해주세요."));
      });
    }
    function withHistoryStore(mode, action) {
      return openHistoryDB().then(db => new Promise((resolve, reject) => {
        let tx, result, settled = false;
        const finish = error => {
          if (settled) return;
          settled = true; db.close();
          if (error) reject(error); else resolve(result);
        };
        try {
          tx = db.transaction(HISTORY_STORE, mode);
          tx.oncomplete = () => finish();
          tx.onerror = () => finish(tx.error || new Error("이력 저장소 작업이 실패했습니다."));
          tx.onabort = () => finish(tx.error || new Error("이력 저장소 작업이 취소됐습니다."));
          action(tx.objectStore(HISTORY_STORE), value => { result = value; });
        } catch (error) {
          if (tx) { try { tx.abort(); } catch (_) {} }
          finish(error);
        }
      }));
    }
    let historyWriteQueue = Promise.resolve();
    function enqueueHistoryWrite(action) {
      const job = historyWriteQueue.then(action);
      // 한 번 실패한 작업이 다음 기록까지 막지 않도록 큐를 유지합니다.
      historyWriteQueue = job.catch(() => {});
      return job;
    }
    function getHistoryByDate(date) {
      return historyWriteQueue.then(() => withHistoryStore("readonly", (store, setResult) => {
        const req = store.get(date); req.onsuccess = () => setResult(req.result || null);
      }));
    }
    function putHistory(snapshot) {
      return enqueueHistoryWrite(() => withHistoryStore("readwrite", (store, setResult) => { store.put(snapshot); setResult(true); }));
    }
    function getAllHistory() {
      return historyWriteQueue.then(() => withHistoryStore("readonly", (store, setResult) => {
        const req = store.getAll(); req.onsuccess = () => setResult(req.result || []);
      }));
    }
    function mergeHistory(snapshots) {
      if (!Array.isArray(snapshots) || !snapshots.length) return Promise.resolve(true);
      return enqueueHistoryWrite(() => withHistoryStore("readwrite", (store, setResult) => {
        snapshots.forEach(row => { if (row && row.date) store.put(row); }); setResult(true);
      }));
    }

    // 로컬 기준 YYYY-MM-DD (UTC 아님 — 한국 날짜 정확)
    function localDateKey(d) {
      const dt = d || new Date();
      const y = dt.getFullYear();
      const m = String(dt.getMonth() + 1).padStart(2, "0");
      const day = String(dt.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }
